name: create a new release

on:
  push:
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
        pyver:
          - "3.12"

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.pyver }}

      - name: install uv
        uses: astral-sh/setup-uv@v6

      - name: build distribution
        run: uv build

      - name: check tag matches package version
        run: |
          whl=(dist/sfrun-*.whl)
          version=${whl[0]#dist/sfrun-}
          version=${version%%-*}
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi

      - name: create github release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes ""

      - name: upload artifact to github release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/** --repo "$GITHUB_REPOSITORY"
